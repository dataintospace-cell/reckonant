<style>html,body,#root{margin:0;height:100%}body{background:#F8FAFC;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

<script>/* Loads every company from the Reckonant API, 100 at a time, before the app opens.
   Shows progress while it loads. If the API is not reachable, the built-in sample data is used. */
window.__rkReady = (async function () {
  function show(text) {
    var box = document.getElementById("rk-loading");
    if (!box) {
      box = document.createElement("div");
      box.id = "rk-loading";
      box.setAttribute("style", "position:fixed;inset:0;display:grid;place-items:center;background:#F8FAFC;color:#334155;font:15px system-ui,Segoe UI,Arial,sans-serif;z-index:9999;padding:24px;text-align:center");
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = text;
  }
  var PAGE = 100, all = [], total = null, offset = 0, first = null;
  try {
    show("Loading companies…");
    while (total === null || offset < total) {
      var r = await fetch("/api/companies/page?offset=" + offset + "&limit=" + PAGE, { credentials: "include" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      var d = await r.json();
      if (!first) first = d;
      total = d.total;
      if (!d.companies || !d.companies.length) break;
      for (var i = 0; i < d.companies.length; i++) all.push(d.companies[i]);
      offset += PAGE;
      show("Loading companies: " + Math.min(offset, total).toLocaleString("en-GB") + " of " + total.toLocaleString("en-GB") + "…");
    }
    if (all.length) {
      window.__RK_DATA = { source: first.source, datasetId: first.datasetId, updated: first.updated, companies: all };
    }
  } catch (e) {
    show("Could not load companies (" + e.message + "). Showing sample data instead.");
    await new Promise(function (res) { setTimeout(res, 2500); });
  }
  var done = document.getElementById("rk-loading");
  if (done) done.remove();
})();
</script>
