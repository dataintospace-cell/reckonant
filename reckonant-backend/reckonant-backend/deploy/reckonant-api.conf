# nginx: send the data endpoints to the Python API (port 8000); everything else under /api/ stays on the Node
# server (sign-in, saved state, emails). Only signed-in users get through (same check as /app/).
# Add inside the reckonant.com server block, e.g. save as /etc/nginx/snippets/reckonant-api.conf and add
#   include snippets/reckonant-api.conf;
# next to the existing  include snippets/reckonant-app.conf;  line, then: nginx -t && systemctl reload nginx
location ~ ^/api/(companies|dashboard|signals|tenders)(/|$) {
    auth_request /_rk_auth;
    error_page 401 = @rk_api_401;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
location @rk_api_401 { default_type application/json; return 401 '{"error":"Please sign in"}'; }
